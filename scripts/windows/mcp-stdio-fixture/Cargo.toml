[package]
name = "atrio-windows-mcp-stdio-fixture"
version = "0.0.6"
edition = "2021"
rust-version = "1.85"
publish = false

[[bin]]
name = "verify-gui-mcp"
path = "src/verify_gui_mcp.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_IO", "Win32_Storage_FileSystem"] }